name: Keep Supabase Active

on:
  schedule:
    - cron: '0 0 */3 * *'

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -f \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cabins?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
